name: reliability-lab-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: make test
      - name: Enforce statement-line coverage floor
        run: make coverage
      - name: Run deterministic reliability experiment
        run: make experiment
      - name: Publish experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-results-python-${{ matrix.python-version }}
          path: docs/results/latest.json
